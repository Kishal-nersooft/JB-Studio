  <style>
    .spc-wrapper {
      min-height: 80vh;
      padding: 40px 16px;
      background: #fafbfc;
    }

    .spc-header {
      margin-bottom: 28px;
    }

    /* Status Icons */
    .spc-status-icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      animation: spcScaleIn 0.5s ease-out;
    }

    .spc-status-icon i {
      font-size: 36px;
      color: #fff;
    }

    .spc-status-success {
      background: #10b981;
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.35);
    }

    .spc-status-pending {
      background: #f59e0b;
      box-shadow: 0 12px 32px rgba(245, 158, 11, 0.3);
    }

    .spc-status-error {
      background: #ef4444;
      box-shadow: 0 12px 32px rgba(239, 68, 68, 0.3);
    }

    /* Animated Checkmark */
    .spc-checkmark {
      width: 46px;
      height: 46px;
    }

    .spc-checkmark-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 2;
      stroke-miterlimit: 10;
      stroke: rgba(255,255,255,0.3);
      animation: spcCircle 0.6s ease-in-out 0.3s forwards;
    }

    .spc-checkmark-check {
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: spcCheck 0.4s ease-in-out 0.7s forwards;
    }

    @keyframes spcScaleIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes spcCircle {
      100% { stroke-dashoffset: 0; }
    }

    @keyframes spcCheck {
      100% { stroke-dashoffset: 0; }
    }

    .spc-title {
      font-size: 26px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .spc-subtitle {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 12px;
    }

    /* Status Badges */
    .spc-badge {
      display: inline-block;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 20px;
    }

    .spc-badge-success {
      background: #dcfce7;
      color: #166534;
    }

    .spc-badge-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .spc-badge-error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* Card */
    .spc-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .spc-card-header {
      padding: 18px 22px;
      border-bottom: 1px solid #f1f5f9;
    }

    .spc-card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin: 0;
    }

    .spc-card-body {
      padding: 0;
    }

    /* Detail Rows */
    .spc-detail-row {
      padding: 14px 22px;
      border-bottom: 1px solid #f1f5f9;
    }

    .spc-detail-row:last-child {
      border-bottom: none;
    }

    .spc-detail-label {
      font-weight: 600;
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 3px;
    }

    .spc-detail-value {
      color: #1e293b;
      font-size: 15px;
      font-weight: 500;
    }

    .spc-detail-meta {
      color: #94a3b8;
      font-size: 13px;
    }

    .spc-service-line {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .spc-service-line:last-child {
      margin-bottom: 0;
    }

    .spc-service-price {
      font-weight: 600;
      color: #1e293b;
      font-size: 15px;
      white-space: nowrap;
      margin-left: 12px;
    }

    /* Payment Summary */
    .spc-payment-summary {
      background: #f8fafc;
      padding: 18px 22px;
    }

    .spc-payment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 14px;
      color: #475569;
    }

    .spc-payment-row-muted {
      font-size: 13px;
      color: #94a3b8;
    }

    .spc-payment-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 6px;
      margin-top: 6px;
      border-top: 2px solid #e2e8f0;
      font-weight: 700;
      font-size: 16px;
      color: #1e293b;
    }

    .spc-amount-paid {
      font-size: 18px;
      color: #10b981;
    }

    /* Actions */
    .spc-actions {
      margin-top: 28px;
    }

    .spc-new-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      color: #3d7bd6;
      background: transparent;
      border: 2px solid #8ab8f2;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .spc-new-btn:hover {
      background: #8ab8f2;
      color: #12305e;
      text-decoration: none;
    }

    .spc-new-btn i {
      font-size: 12px;
    }

    .spc-print-wrap {
      margin-top: 12px;
    }

    .spc-print-link {
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }

    .spc-print-link:hover {
      color: #64748b;
      text-decoration: underline;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .spc-title { font-size: 30px; }
      .spc-status-icon { width: 92px; height: 92px; }
      .spc-status-icon i { font-size: 40px; }
      .spc-checkmark { width: 50px; height: 50px; }
      .spc-card-header { padding: 20px 26px; }
      .spc-detail-row { padding: 16px 26px; }
      .spc-payment-summary { padding: 20px 26px; }
    }

    @media (max-width: 767px) {
      .spc-wrapper { padding: 20px 12px; }
      .spc-status-icon { width: 72px; height: 72px; }
      .spc-status-icon i { font-size: 32px; }
      .spc-checkmark { width: 40px; height: 40px; }
      .spc-title { font-size: 22px; }
      .spc-subtitle { font-size: 14px; }
      .spc-detail-row { padding: 12px 16px; }
      .spc-card-header { padding: 14px 16px; }
      .spc-card-title { font-size: 16px; }
      .spc-payment-summary { padding: 14px 16px; }
      .spc-new-btn { padding: 10px 20px; font-size: 13px; }
    }

    @media (max-width: 375px) {
      .spc-wrapper { padding: 16px 8px; }
      .spc-title { font-size: 20px; }
    }
  </style>
