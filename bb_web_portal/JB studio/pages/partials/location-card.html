<div class="col-12">
    <div class="location-salon-card card h-100 shadow-sm" data-salon-id="{{id}}">
        <div class="location-salon-image">
            <img src="{{image}}" alt="{{name}}" class="card-img-top"/>
        </div>
        <div class="location-salon-info card-body">
            <h3 class="location-salon-name card-title h6 mb-2">{{name}}</h3>
            <div class="location-salon-address text-muted small mb-2">
                <span>{{city}}</span>, <span>{{state}}</span>
            </div>
            <div class="location-salon-category badge bg-light text-dark">Beauty Salon</div>
        </div>
    </div>
</div>
